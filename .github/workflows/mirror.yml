name: Mirror

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to copy to Cloudflare, like v0.1.3
        required: true

permissions:
  contents: read

jobs:
  r2:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag }}
      BUCKET: eleven-releases
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Eleven-*' --dir dist
      - name: Upload to R2
        run: |
          for file in dist/*; do
            npx -y wrangler@4 r2 object put "$BUCKET/$TAG/$(basename "$file")" --file "$file" --remote
          done
          printf '{"version":"%s"}\n' "${TAG#v}" > latest.json
          npx -y wrangler@4 r2 object put "$BUCKET/latest.json" --file latest.json --content-type application/json --cache-control 'max-age=60' --remote
