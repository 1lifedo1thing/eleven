name: Mirror

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to copy to Cloudflare, like v0.1.3
        required: true
  push:
    branches: [main]
    paths: [install.sh, install.ps1]

permissions:
  contents: read

env:
  BUCKET: eleven-releases
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upload the install scripts to R2
        run: |
          for script in install.sh install.ps1; do
            npx -y wrangler@4 r2 object put "$BUCKET/$script" --file "$script" --content-type 'text/plain; charset=utf-8' --cache-control 'max-age=300' --remote
          done

  release:
    if: inputs.tag != ''
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Eleven-*' --dir dist
      - name: Upload the release to R2
        run: |
          for file in dist/*; do
            npx -y wrangler@4 r2 object put "$BUCKET/$TAG/$(basename "$file")" --file "$file" --remote
          done
          printf '{"version":"%s"}\n' "${TAG#v}" > latest.json
          npx -y wrangler@4 r2 object put "$BUCKET/latest.json" --file latest.json --content-type application/json --cache-control 'max-age=60' --remote
