name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/gpuix
          ref: eleven
          path: gpuix
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Use the GPUIX types from the Eleven branch
        run: ELEVEN_GPUIX_SOURCE="$GITHUB_WORKSPACE/gpuix" bash script/build-gpuix --js-only
      - run: bunx tsc --noEmit --noUnusedLocals

  install-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      ELEVEN_NO_LAUNCH: "1"
      ELEVEN_DEST: ${{ github.workspace }}\eleven-install
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw install.ps1 | Invoke-Expression"
      - name: Check what it installed
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ELEVEN_DEST\bin\Eleven.exe")) { throw "Eleven.exe is missing" }
          if (-not (Test-Path ([IO.Path]::Combine([Environment]::GetFolderPath("Programs"), "Eleven.lnk")))) { throw "Start menu shortcut is missing" }
