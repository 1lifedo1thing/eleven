name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.3
  REA_REF: feat/set-code-type
  GPUIX_REF: eleven
  HUSKY: "0"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: eleven
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/rea
          ref: ${{ env.REA_REF }}
          path: rea
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version-file: rea/.nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build REA
        working-directory: rea
        run: npm ci --no-audit --no-fund && npm run build:cached
      - name: Install app dependencies
        working-directory: eleven/app
        run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/gpuix
          ref: ${{ env.GPUIX_REF }}
          path: gpuix
          submodules: recursive
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Cache GPUIX build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gpuix/packages/native/target
          key: gpuix-${{ runner.os }}-${{ hashFiles('gpuix/packages/native/Cargo.lock') }}
          restore-keys: gpuix-${{ runner.os }}-
      - name: Build GPUIX from the Eleven branch
        shell: bash
        run: (cd gpuix && rustup show active-toolchain || rustup toolchain install) && bash eleven/app/script/build-gpuix
      - name: Import signing certificate and notary key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "MACOS_CERT_P12 not set; the app will be ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/eleven.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool store-credentials eleven-notary \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --keychain "$keychain"
            rm -f "$RUNNER_TEMP/AuthKey.p8"
          fi
      - name: Package
        working-directory: eleven/app
        env:
          ELEVEN_SIGN_IDENTITY: ${{ secrets.ELEVEN_SIGN_IDENTITY }}
          HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          [ -n "$ELEVEN_SIGN_IDENTITY" ] || unset ELEVEN_SIGN_IDENTITY
          [ "$HAS_NOTARY_KEY" = true ] || export ELEVEN_NOTARY_PROFILE=skip
          script/package
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-macos
          path: eleven/app/build/Eleven-*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: eleven
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/rea
          ref: ${{ env.REA_REF }}
          path: rea
      - uses: actions/setup-node@v4
        with:
          node-version-file: rea/.nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv pkg-config patchelf libxkbcommon-x11-0
      - name: Build REA
        working-directory: rea
        run: npm ci --no-audit --no-fund && npm run build:cached
      - name: Install app dependencies
        working-directory: eleven/app
        run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/gpuix
          ref: ${{ env.GPUIX_REF }}
          path: gpuix
          submodules: recursive
      - name: Install GPUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - name: Cache GPUIX build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gpuix/packages/native/target
          key: gpuix-${{ runner.os }}-${{ hashFiles('gpuix/packages/native/Cargo.lock') }}
          restore-keys: gpuix-${{ runner.os }}-
      - name: Build GPUIX from the Eleven branch
        shell: bash
        run: (cd gpuix && rustup show active-toolchain || rustup toolchain install) && bash eleven/app/script/build-gpuix
      - name: Fetch appimagetool
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Package
        working-directory: eleven/app
        run: script/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-linux
          path: |
            eleven/app/build/Eleven-*.tar.gz
            eleven/app/build/Eleven-*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: eleven
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/rea
          ref: ${{ env.REA_REF }}
          path: rea
      - uses: actions/setup-node@v4
        with:
          node-version-file: rea/.nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build REA
        working-directory: rea
        run: npm ci --no-audit --no-fund && npm run build:cached
      - name: Install app dependencies
        working-directory: eleven/app
        run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: Zfinix/gpuix
          ref: ${{ env.GPUIX_REF }}
          path: gpuix
          submodules: recursive
      - name: Cache GPUIX build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gpuix/packages/native/target
          key: gpuix-${{ runner.os }}-${{ hashFiles('gpuix/packages/native/Cargo.lock') }}
          restore-keys: gpuix-${{ runner.os }}-
      - name: Build GPUIX from the Eleven branch
        shell: bash
        run: (cd gpuix && rustup show active-toolchain || rustup toolchain install) && bash eleven/app/script/build-gpuix
      - name: Package
        working-directory: eleven/app
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: script/bundle-windows
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-windows
          path: eleven/app/build/Eleven-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  mirror:
    needs: release
    uses: ./.github/workflows/mirror.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
