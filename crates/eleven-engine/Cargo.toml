[package]
name = "eleven-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.5.1", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "process", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt"] }
